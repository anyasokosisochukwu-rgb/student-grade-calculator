<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    form { background: #f5f5f5; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
    input { margin: 0.3rem; padding: 0.5rem; width: 100%; max-width: 250px; }
    button { padding: 0.6rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; }
    .student-card { border: 1px solid #ddd; padding: 1rem; border-radius: 6px; margin: 0.5rem 0; }
    .delete-btn { background: #dc2626; margin-left: 1rem; }
    .status-pass { color: green; font-weight: bold; }
    .status-fail { color: red; font-weight: bold; }
    .error { color: red; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>📘 Student Grade Calculator</h1>

  <form id="studentForm">
    <h3>Add Student</h3>
    <div>
      <label>Student Name:</label>
      <input type="text" id="nameInput" placeholder="Enter name" required>
    </div>
    <div>
      <label>Score 1:</label>
      <input type="number" id="score1" min="0" max="100" required>
    </div>
    <div>
      <label>Score 2:</label>
      <input type="number" id="score2" min="0" max="100" required>
    </div>
    <div>
      <label>Score 3:</label>
      <input type="number" id="score3" min="0" max="100" required>
    </div>
    <div>
      <label>Score 4 (optional):</label>
      <input type="number" id="score4" min="0" max="100">
    </div>
    <button type="submit">Calculate & Save</button>
    <div id="errorMsg" class="error"></div>
  </form>

  <h3>Student Records</h3>
  <div id="studentList"></div>

  <script src="app.js"></script>
</body>
</html>
